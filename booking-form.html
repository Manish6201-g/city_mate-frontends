<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book a Service — CityMate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo"><i class="fas fa-compass"></i> CityMate</a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="guides.html">Guides</a>
        <a href="stays.html">Stays</a>
        <a href="reviews.html">Reviews</a>
        <a href="contact.html">Contact</a>
        <a href="booking-form.html" class="nav-book-btn">Book Now</a>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme"><i class="fas fa-moon"></i></button>
      </div>
      <div class="hamburger" onclick="document.querySelector('.mobile-menu').classList.toggle('open')"><span></span><span></span><span></span></div>
    </div>
  </nav>
<div class="mobile-menu"><a href="index.html">Home</a><a href="services.html">Services</a><a href="guides.html">Guides</a><a href="stays.html">Stays</a><a href="reviews.html">Reviews</a><a href="contact.html">Contact</a><a href="booking-form.html" class="nav-book-btn" style="display:inline-block;margin-top:0.5rem;">Book Now</a></div>

  <div class="form-container">
    <div class="form-card">
      <h2><i class="fas fa-calendar-check" style="color:var(--accent);"></i> Book a Service</h2>
      <p>Fill in your details and we'll connect you with the perfect local expert.</p>

      <form id="bookingForm">
        <div class="form-group">
          <label>Full Name <span>*</span></label>
          <input type="text" id="b-name" placeholder="Your full name" required>
        </div>
        <div class="form-group">
          <label>Email <span>*</span></label>
          <input type="email" id="b-email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="tel" id="b-phone" placeholder="+91 98765 43210">
        </div>
        <div class="form-group">
          <label>Service <span>*</span></label>
          <select id="b-service" required>
            <option value="">Select a service</option>
            <option value="Personal Guide">Personal Guide</option>
            <option value="Curated Stay">Curated Stay</option>
            <option value="Day Trip">Day Trip</option>
            <option value="Food Tour">Food Tour</option>
            <option value="Photography Tour">Photography Tour</option>
            <option value="Cultural Experience">Cultural Experience</option>
          </select>
        </div>
        <div class="form-group">
          <label>Preferred Date <span>*</span></label>
          <input type="date" id="b-date" required>
        </div>
        <div class="form-group">
          <label>Additional Notes</label>
          <textarea id="b-message" placeholder="Tell us about your trip, preferences, or any special requests..."></textarea>
        </div>
        <button type="submit" class="btn-submit" id="b-submit">
          <i class="fas fa-paper-plane"></i> Submit Booking
        </button>
      </form>
    </div>
  </div>

  <footer class="footer"><p>© 2025 CityMate. Crafted for travelers, by locals.</p></footer>

  <script type="module">
    import { bookService } from './api.js';

    document.getElementById('bookingForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('b-submit');

      const name = document.getElementById('b-name').value.trim();
      const email = document.getElementById('b-email').value.trim();
      const phone = document.getElementById('b-phone').value.trim();
      const service = document.getElementById('b-service').value;
      const date = document.getElementById('b-date').value;
      const message = document.getElementById('b-message').value.trim();

      if (!validateEmail(email)) {
        showToast('Please enter a valid email address', 'error');
        return;
      }

      setLoading(btn, true);
      try {
        await bookService({ name, email, phone, service, date, message });
        showToast('Booking submitted successfully! We\'ll be in touch soon.', 'success');
        document.getElementById('bookingForm').reset();
      } catch (err) {
        showToast(err.message || 'Failed to submit booking', 'error');
      } finally {
        setLoading(btn, false);
      }
    });
  </script>
  <script src="script.js"></script>
</body>
</html>
