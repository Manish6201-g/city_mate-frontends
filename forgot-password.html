<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — CityMate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div style="text-align:center;margin-bottom:1.5rem;">
        <i class="fas fa-compass" style="font-size:2.5rem;color:var(--accent);"></i>
      </div>
      <h2>Reset Password</h2>
      <p>Enter your admin email to receive a password reset token.</p>

      <form id="forgotForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="f-email" placeholder="admin@citymate.com" required>
        </div>
        <button type="submit" class="btn-submit" id="f-submit">
          <i class="fas fa-paper-plane"></i> Request Reset Token
        </button>
      </form>

      <div id="token-result" style="display:none;margin-top:1.5rem;padding:1rem;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);">
        <p style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:0.5rem;">Your reset token (valid for 1 hour):</p>
        <code id="token-display" style="display:block;padding:0.5rem;background:var(--bg-page);border-radius:4px;word-break:break-all;font-size:0.8rem;color:var(--accent);"></code>
        <a href="reset-password.html" style="display:inline-block;margin-top:0.75rem;font-size:0.85rem;color:var(--accent);">→ Go to Reset Password</a>
      </div>

      <p style="text-align:center;margin-top:1.5rem;font-size:0.85rem;color:var(--text-dim);">
        <a href="login.html" style="color:var(--accent);">← Back to login</a>
      </p>
    </div>
  </div>

  <script type="module">
    import { requestPasswordReset } from './api.js';

    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('f-submit');
      const email = document.getElementById('f-email').value.trim();

      setLoading(btn, true);
      try {
        const res = await requestPasswordReset(email);
        if (res.resetToken) {
          document.getElementById('token-display').textContent = res.resetToken;
          document.getElementById('token-result').style.display = 'block';
          showToast('Reset token generated. Check below.', 'success');
        } else {
          showToast(res.message || 'If an account exists, a reset token has been generated.', 'info');
        }
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        setLoading(btn, false);
      }
    });
  </script>
  <script src="script.js"></script>
</body>
</html>
