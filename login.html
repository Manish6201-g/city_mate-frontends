<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — CityMate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div style="text-align:center;margin-bottom:1.5rem;">
        <i class="fas fa-compass" style="font-size:2.5rem;color:var(--accent);"></i>
      </div>
      <h2>Admin Login</h2>
      <p>Sign in to access the CityMate admin dashboard.</p>

      <form id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="l-email" placeholder="admin@citymate.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="l-password" placeholder="••••••••" required>
          <div style="text-align:right;margin-top:0.25rem;">
            <a href="forgot-password.html" style="font-size:0.8rem;color:var(--accent);">Forgot Password?</a>
          </div>
        </div>
        <button type="submit" class="btn-submit" id="l-submit">
          <i class="fas fa-sign-in-alt"></i> Sign In
        </button>
      </form>

      <p style="text-align:center;margin-top:1.5rem;font-size:0.85rem;color:var(--text-dim);">
        <a href="index.html" style="color:var(--accent);">← Back to website</a>
      </p>
    </div>
  </div>

  <script type="module">
    import { loginAdmin } from './api.js';

    // Redirect if already logged in
    if (localStorage.getItem('cm_token')) {
      window.location.href = 'admin.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('l-submit');
      const email = document.getElementById('l-email').value.trim();
      const password = document.getElementById('l-password').value;

      setLoading(btn, true);
      try {
        const res = await loginAdmin(email, password);
        localStorage.setItem('cm_token', res.token);
        showToast('Login successful! Redirecting...', 'success');
        setTimeout(() => window.location.href = 'admin.html', 800);
      } catch (err) {
        showToast(err.message === 'Invalid credentials' ? 'Invalid email or password' : err.message, 'error');
      } finally {
        setLoading(btn, false);
      }
    });
  </script>
  <script src="script.js"></script>
</body>
</html>
