<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — CityMate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div style="text-align:center;margin-bottom:1.5rem;">
        <i class="fas fa-compass" style="font-size:2.5rem;color:var(--accent);"></i>
      </div>
      <h2>Set New Password</h2>
      <p>Enter your reset token and a new password.</p>

      <form id="resetForm">
        <div class="form-group">
          <label>Reset Token</label>
          <input type="text" id="r-token" placeholder="Paste your reset token here" required>
        </div>
        <div class="form-group">
          <label>New Password</label>
          <input type="password" id="r-password" placeholder="Min. 6 characters" required minlength="6">
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="r-confirm" placeholder="Repeat password" required minlength="6">
        </div>
        <button type="submit" class="btn-submit" id="r-submit">
          <i class="fas fa-key"></i> Reset Password
        </button>
      </form>

      <p style="text-align:center;margin-top:1.5rem;font-size:0.85rem;color:var(--text-dim);">
        <a href="login.html" style="color:var(--accent);">← Back to login</a>
      </p>
    </div>
  </div>

  <script type="module">
    import { resetPassword } from './api.js';

    // Pre-fill token from URL if present
    const params = new URLSearchParams(window.location.search);
    const urlToken = params.get('token');
    if (urlToken) {
      document.getElementById('r-token').value = urlToken;
    }

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('r-submit');
      const token = document.getElementById('r-token').value.trim();
      const password = document.getElementById('r-password').value;
      const confirm = document.getElementById('r-confirm').value;

      if (password !== confirm) {
        showToast('Passwords do not match', 'error');
        return;
      }

      setLoading(btn, true);
      try {
        await resetPassword(token, password);
        showToast('Password reset successful! Redirecting to login...', 'success');
        setTimeout(() => window.location.href = 'login.html', 1500);
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        setLoading(btn, false);
      }
    });
  </script>
  <script src="script.js"></script>
</body>
</html>
